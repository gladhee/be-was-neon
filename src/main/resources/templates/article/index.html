<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../reset.css" rel="stylesheet" />
    <link href="../global.css" rel="stylesheet" />
</head>
<body>
<div class="container">
    <div data-include="header"></div>
    <div class="page">
        <h2 class="page-title">게시글 작성</h2>

        <form class="form" method="POST" action="/articles">
            <div class="textfield textfield_size_m">
                <p class="title_textfield">내용</p>
                <textarea
                        name="content"
                        class="input_textfield"
                        placeholder="글의 내용을 입력하세요"
                        rows="8"
                        required
                ></textarea>
            </div>
            <button
                    id="submit-article-btn"
                    class="btn btn_contained btn_size_m"
                    style="margin-top: 24px"
                    type="submit"
            >
                작성 완료
            </button>
        </form>
    </div>
</div>
</body>
</html>
